<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#dbe6f5" />
    <!-- M12.1: an installable home-screen app (no service worker: nothing cached, so no stale multiplayer client). On iPhone, Add to Home Screen opens it without Safari's bars. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rumble" />
    <title>Blobbi Rumble</title>
    <link rel="stylesheet" href="/src/playground/styles.css" />
    <style>
      /* M12: the canvas is exactly the visible page (no 100vh overhang behind a phone's browser bars). */
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
      #hud { position: fixed; right: 12px; top: 12px; width: 500px; max-width: calc(100vw - 24px); background: rgba(255,255,255,0.86); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 14px; font: 12px ui-monospace, Menlo, monospace; color: #2b2b3a; white-space: pre; box-shadow: 0 8px 30px rgba(40,50,80,0.18); }
      #hud b { font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/rumble/main.ts"></script>
  </body>
</html>
